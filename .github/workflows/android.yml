name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files (works even if everything was uploaded to the repo root)
        run: |
          mkdir -p www assets
          [ -f www/index.html ] || cp index.html www/index.html
          for f in icon-only.png icon-foreground.png icon-background.png; do
            [ -f assets/$f ] || cp $f assets/$f
          done

      - name: Write Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ma.tri9i.app",
            "appName": "TRi9i",
            "webDir": "www",
            "server": {
              "url": "https://tri9maroc-ui.github.io/tri9i/",
              "cleartext": false
            }
          }
          EOF
          cat capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: App icon (optional, build continues if it fails)
        run: npx --yes @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tri9i-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
